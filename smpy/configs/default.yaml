# SMPy default configuration
#
# Every setting and its default value. A YAML file passed to `smpy -c`, or
# keyword arguments to smpy.map_mass, only need the settings that differ.
# Keyword arguments use the same names as the keys below.

#------General settings------#
general:
  # Input catalog
  input_path: ""  # Relative paths resolve from the YAML file's directory
  input_hdu: 1  # FITS extension holding the catalog
  coord_system: "radec"  # 'radec' or 'pixel'
  radec:
    pixel_scale: null  # Map pixel size in arcminutes (required)
    coord1_col: "ra"  # RA column, in degrees
    coord2_col: "dec"  # Dec column, in degrees
  pixel:
    downsample_factor: null  # Catalog pixels per map pixel (required)
    coord1_col: "X_IMAGE"  # X column
    coord2_col: "Y_IMAGE"  # Y column
  g1_col: "g1"
  g2_col: "g2"
  weight_col: null  # null for unit weights

  # Analysis
  method: "kaiser_squires"  # 'kaiser_squires', 'aperture_mass', or 'ks_plus'
  create_snr: false  # Also compute signal-to-noise maps

  # Outputs, written only by smpy.run and the smpy command
  output_directory: "."  # Relative paths resolve from the YAML file's directory
  output_base_name: "smpy_output"
  mode: ['E']  # Modes to write: ['E'], ['B'], or ['E', 'B']
  save_plots: true  # Write PNG plots
  save_fits: false  # Write FITS maps
  create_counts_map: false  # Write a plot of galaxies per pixel

#------Method settings------#
methods:
  kaiser_squires:
    smoothing: 2.0  # Gaussian sigma in map pixels; 0 for no smoothing

  aperture_mass:
    filter_type: 'schirmer'  # 'schirmer' or 'schneider'
    filter_scale: 10  # Aperture radius in map pixels
    truncation: 1.0  # Kernel radius in units of filter_scale
    ell: 3  # Polynomial order of the Schneider filter

  ks_plus:
    smoothing: 2.0  # Gaussian sigma in map pixels; 0 for no smoothing
    inpainting_iterations: 100
    reduced_shear_iterations: 3
    nscales: null  # Starlet scales; null for the largest safe number, larger values are clipped
    extension_size: 'double'  # 'double', or pixels added on each side
    use_wavelet_constraints: true  # Match E- and B-mode wavelet power inside the gaps to that outside

#------Plot settings------#
plotting:
  figsize: [12, 8]
  fontsize: 15
  cmap: 'viridis'
  xlabel: 'auto'  # 'auto', null, or custom string
  ylabel: 'auto'  # 'auto', null, or custom string
  plot_title: 'Mass Map'  # The mode is appended
  gridlines: true
  vmax: null
  vmin: null
  threshold: null  # Peak detection threshold
  verbose: null  # Print peak information
  cluster_center: null  # null, 'auto', or {ra/x_center: float, dec/y_center: float}
  axis_reference: 'catalog'  # Pixel plots: 'catalog' or 'map' axes
  overlay_counts: false  # Write galaxies per pixel on map plots
  xray_contours:
    ctr_file: null  # DS9 .ctr file; relative paths resolve like input_path
    show_on_convergence: false  # Overlay contours on convergence plots
    show_on_snr: false  # Overlay contours on SNR plots
    color: 'cyan'  # Matplotlib line color
    linewidth: 0.8  # Line width for contour traces
    alpha: 0.7  # Opacity in [0, 1]
  scaling:
    type: 'linear'  # 'linear', 'power', or 'symlog'
    gamma: 2  # For power: exponent of the power law
    percentile: null  # null, or [n, m] to scale between the nth and mth percentiles
    convergence:
      linthresh: 0.1  # For symlog: half-width of the linear region around zero
      linscale: 1.0  # For symlog: scaling factor for the linear region
    snr:
      linthresh: 5
      linscale: 0.5

#------SNR settings------#
snr:
  shuffle_type: 'orientation'  # 'orientation' (turn each shear by a random angle) or 'spatial' (permute positions)
  num_shuffles: 100  # Number of shuffled catalogs; at least 2
  seed: 0  # Integer, or 'random' for a seed from the secrets module; the seed used is recorded
  plot_title: 'Signal-to-Noise Map'  # The mode is appended
