name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]" ruff==0.16.8
      - run: ruff check
      - run: python -m pytest --cov=smpy --cov-branch --cov-report=xml
      - if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: sudo apt-get install -y pandoc
      - run: python -m pip install . -r docs/requirements.txt
      # Building the documentation runs every tutorial notebook
      - run: python -m sphinx -W -b html docs/source docs/_build/html
