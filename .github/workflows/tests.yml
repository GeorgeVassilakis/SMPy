name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]" ruff==0.16.8
      - run: ruff check
      - run: python -m pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: sudo apt-get install -y pandoc
      - run: python -m pip install . -r docs/requirements.txt
      # Building the documentation runs every tutorial notebook
      - run: python -m sphinx -W -b html docs/source docs/_build/html
